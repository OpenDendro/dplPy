[build-system]
requires = [
    "setuptools",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name="dplpy"
description="Dendrochronology Program Library for Python"
readme="README.md"
version="0.3.0"
authors=[
    {name='Tyson Lee Swetnam', email='tswetnam@arizona.edu'},
    {name='Ifeoluwa Ale', email='ifeoluwaale@arizona.edu'},
    {name='Kevin Anchukaitis', email='kanchukaitis@arizona.edu'},
]
license={file='LICENSE'}
requires-python = '>=3.10'
dependencies=[
    "numpy>=1.22.4; python_version<'3.11'",
    "numpy>=1.23.2; python_version=='3.11'",
    "numpy>=1.26.0; python_version>='3.12'",
    "pandas>=2.2.2,<3",

    "csaps>=1.1.0",
    "matplotlib>=3.8.4",
    "statsmodels>=0.14.2",
    "scipy>=1.13.0"
]

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["dplpy"]
