[build-system]
requires = [
    "setuptools",
    "wheel"
]
build-backend = "setuptools.build_meta"

[project]
name="dplpy"
description="Dendrochronology Program Library for Python"
readme="README.md"
version="0.8.0"
authors=[
    {name='Tyson Lee Swetnam', email='tswetnam@arizona.edu'},
    {name='Ifeoluwa Ale', email='ifeoluwaale@arizona.edu'},
    {name='Kevin Anchukaitis', email='kanchukaitis@arizona.edu'},
]
license={file='LICENSE'}
requires-python = '>=3.11'
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Operating System :: OS Independent",
]
dependencies=[
    "numpy>=1.23.2; python_version=='3.11'",
    "numpy>=1.26.0; python_version>='3.12'",
    "pandas>=2.2.2",

    "csaps>=1.1.0",
    "matplotlib>=3.8.4",
    "statsmodels>=0.14.2",
    "scipy>=1.13.0"
]

# Optional extras. LiPD import/export is built on `pylipd`, which most dplPy
# users don't need, so it is not a core dependency. Install it with:
#     pip install "dplpy[lipd]"
[project.optional-dependencies]
lipd = ["pylipd>=1.5,<2"]

# Console entry point: installs a `dplpy` command that calls dplpy.cli:main.
# dplPy is primarily a library (`import dplpy as dpl`); this is a small
# convenience CLI (version / help / open the manual).
[project.scripts]
dplpy = "dplpy.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["dplpy"]
