site_name: dplPy
site_description: Dendrochronology Program Library for Python
site_author: Andy Bunn, Kevin Anchukaitis, Tyson Swetnam
site_url: https://opendendro.github.io/dplpy

# Repository
repo_name: OpenDendro/dplPy
repo_url: https://github.com/opendendro/dplpy
# Copyright
copyright: 'Copyright &copy; 2021 - 2026 OpenDendro'

# Configuration
theme:
  name: material
  logo: assets/dplpy.png
  favicon: assets/dplpy.png
  language: en
  palette:
    scheme: default
    primary: blue
    accent: pink
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - content.code.copy
    - search.suggest
    - search.highlight

# Plugins
plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: numpy
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_signature_annotations: true
            separate_signature: true
            heading_level: 2
            members_order: source
            filters:
              - "!^_"

# Options
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/opendendro

# Extensions
markdown_extensions:
  - admonition
  - abbr
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem:
      smart_enable: all
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.smartsymbols
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

# Page tree
nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - User Guide:
      - Reading & writing data: guide/reading-writing-data.md
      - Detrending & standardization: guide/detrending-standardization.md
      - Building chronologies: guide/chronologies.md
      - Crossdating & COFECHA: guide/crossdating.md
      - Coming from dplR: guide/coming-from-dplr.md
  - API Reference:
      - Input & output: reference/io.md
      - Detrending & standardization: reference/detrending.md
      - Chronology: reference/chronology.md
      - Crossdating: reference/crossdating.md
      - Statistics & indices: reference/statistics.md
      - Utilities: reference/utilities.md
