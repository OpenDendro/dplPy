# Build the package and publish it to PyPI after tests pass.
name: Publish to PyPI
on:
  workflow_run:
    workflows: ["run_tests"]
    types:
      - completed
    branches:
      - v0.2.0

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v3
        with:
          ref: v0.2.0
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Build package
        run: |
          python -m pip install -U pip build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@v1.5.0
        with:
          user: __token__
          password: ${{ secrets.DPLPY_PYPI }}
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: v0.2.0
          release_name: v0.2.0
          body: |
            dplPy v0.2.0

            New functionality:
            - chron_ars(): based on dplR and ARSTAN, create the ARS re-reddened chronologies
            - rwi_stats() / rwi_stats_running(): running mean interseries correlation
              (rbar), expressed population signal (EPS), and signal-to-noise ratio (SNR),
              over the whole record or in moving windows. Based on dplR 
            - sss(): subsample signal strength, based on dplR
            - interseries_cor(): mean (COFECHA-style) interseries correlation
            - read_ids(): derive tree/core IDs from site-tree-core series names

            Improvements and fixes:
            - chron_stabilized() and rbar: now has numpy 2.0 compatibility and closer to dplR
            - tbrm(): regularization epsilon now the same as dplR
            - xdate: guard get_crit() against very small sample sizes and divide by zero danger

            Internal:
            - Repository converted to a src/ layout. No change to the public API --
              existing scripts (e.g. dpl.readers(...)) work unchanged.
          draft: false
          prerelease: true
