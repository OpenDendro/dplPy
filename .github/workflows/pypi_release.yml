# Build the package and publish it to PyPI after tests pass.
name: Publish to PyPI
on:
  workflow_run:
    workflows: ["run_tests"]
    types:
      - completed
    branches:
      - v0.6.0

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v3
        with:
          ref: v0.6.0
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Build package
        run: |
          python -m pip install -U pip build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@v1.5.0
        with:
          user: __token__
          password: ${{ secrets.DPLPY_PYPI }}
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: v0.6.0
          release_name: v0.6.0
          body: |
            dplPy v0.6.0

            v0.6.0 adds an ARSTAN-style variance-stabilization option and function,
            changes the ARSTAN chronology construction in chron_ars to follow Ed
            Cook's ARSTAN, now includes a full documentation site, and makes dplPy
            formally citable (CITATION.cff + Zenodo).

            New functionality:
            - stabilize_chron(): variance-stabilize ANY already-built chronology
              (standard, residual, or ARSTAN), decoupled from chronology
              construction, as in ARSTAN. Offers the rbar / effective-sample-size
              family (Osborn 1997; Frank 2006; running rbar by default), the
              ARSTAN spline family, and "both" (rbar then a 67% spline).
            - chron() and chron_ars() gain a stabilize= convenience flag
              ("rbar"/"spline"/"both") that adds stabilized *_vsc columns beside
              each chronology, using ARSTAN's per-chronology rbar convention.

            Consistency and correctness:
            - chron_ars() gains ars_method, defaulting to "arstan": the ARSTAN
              chronology is now built by averaging the prewhitened series and then
              re-reddening (Ed Cook's ARSTAN order), rather than re-reddening each
              series and then averaging. ars_method="dplr" preserves the previous
              dplR chron.ars behavior. std, res, and the pooled AR order are
              unchanged.

            Documentation:
            - A full MkDocs Material documentation site with an auto-generated API
              reference using mkdocstrings, a user guides, a dplR migration map,
              and fidelity/background pages.

            Project:
            - CITATION.cff and .zenodo.json added: dplPy is now citable, and
              releases are archived on Zenodo with a DOI.
          draft: false
          prerelease: true
