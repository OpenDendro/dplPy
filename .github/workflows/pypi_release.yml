# Build the package and publish it to PyPI after tests pass.
name: Publish to PyPI
on:
  workflow_run:
    workflows: ["run_tests"]
    types:
      - completed
    branches:
      - v0.7.0

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v3
        with:
          ref: v0.7.0
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Build package
        run: |
          python -m pip install -U pip build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@v1.5.0
        with:
          user: __token__
          password: ${{ secrets.DPLPY_PYPI }}
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: v0.7.0
          release_name: v0.7.0
          body: |
            dplPy v0.7.0
            
            v0.7.0 improves crossdating and data QA/QC: xdate now prints a COFECHA-style
            summary, the crossdating and floating-series tools accept more flexible inputs,
            readers handles messier ITRDB files, and several ARSTAN-style detrending and
            standardization options are added. It is also the first release tracked in a
            CHANGELOG.
            
            Crossdating and QA/QC:
            - xdate() prints a COFECHA-style summary header (number of series, master span,
              total rings, intercorrelation, mean sensitivity, problem-segment count, mean
              series length) and returns it as res["summary"]; the default path also returns
              n_problems.
            - xdate_report() accepts an already-loaded ring-width DataFrame (with an optional
              name=) in addition to .rwl paths and lists of them.
            - xdate_floater() accepts a single chronology as a pandas Series or one-column
              DataFrame (e.g. a column from read_crn) as the reference, auto-derives the
              series name from a named series, and its plot adds an overlay of the reference
              chronology against the best-placed floater.
            - xdate_floater() raises an impossible/future-date alarm - a warning, a
              best["date_warning"] flag, and a red plot banner - when the best-fit date falls
              after the present calendar year.
            
            Reading data:
            - readers() detects a core whose series-ID letter case flips mid-file (e.g.
              FDD08A -> FDD08a): when the pieces have disjoint years and a stop marker is
              missing it merges them into one series (join=True), recorded on
              df.attrs["dplpy_case_merged"]; case variants that are not merged are listed on
              df.attrs["dplpy_case_variant_ids"].
            - readers() flags characters beyond the last data column and truncated values on
              df.attrs["dplpy_beyond_column"].
            
            Detrending and standardization:
            - detrend() now exposes ARSTAN curve fits: NegExp, Hugershoff, GeneralExp, LinearAny,
              and LinearNegative.
            - powt() reports ARSTAN-like spread-vs-level and skewness statistics with a plot.
            - chron_ars() supports ARSTAN-style backcasting.
            - sfrcs() defaults to a simple (not biweight) mean, following Melvin.
            
            Fixes:
            - xdate_floater() no longer raises an IndexError when the floating series is
              longer than the reference master.
            - xdate_floater()'s plot no longer balloons with white space on a poor match; the
              p-value panel keeps the significance thresholds inside the panel.
            - xdate_report() given a DataFrame no longer misreads its columns as file paths.
            - xdate(preset="COFECHA") no longer emits spurious early segments for a series
              that extends before the multi-series portion of a collection.
            
            Also: report() now shows per-series and total counts for locally absent rings and
            internal NA, with clearer labels; interseries_corr() returns a (mean, per-series)
            tuple; and a CHANGELOG.md now tracks changes going forward.
            
            Note for upgrading: interseries_corr() now returns (mean, per-series) rather than
            just the per-series frame, and xdate_report() uses output="screen"/"file"/"both"
            in place of the former write= argument.
          draft: false
          prerelease: true
