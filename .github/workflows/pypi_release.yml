# Build the package and publish it to PyPI after tests pass.
name: Publish to PyPI
on:
  workflow_run:
    workflows: ["run_tests"]
    types:
      - completed
    branches:
      - v0.4.0

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v3
        with:
          ref: v0.4.0
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Build package
        run: |
          python -m pip install -U pip build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@v1.5.0
        with:
          user: __token__
          password: ${{ secrets.DPLPY_PYPI }}
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: v0.4.0
          release_name: v0.4.0
          body: |
            dplPy v0.4.0
            
            v0.4.0 brings standardization, chronology, crossdating, and agreement/
            sensitivity tools up to dplR parity, and continues to enhance the reader.
            
            New functionality:
            - Standardization: rcs() (regional curve standardization), ads()
              (age-dependent spline; also fit="AgeDepSpline" in detrend), powt()
              (power transformation), ssf() (simple signal-free), and CRUST-like
              presets (preset="crust") for simple RCS/SSF.
            - detrend(): dplR curve names (Spline, ModNegExp, ModHugershoff,
              Mean, AgeDepSpline) with proper negexp->linear->mean fallback chain; a
              ARSTAN-similar Hugershoff; allow fitting a list of curves (dplR); new
              spline frequency response, return info, and verbose arguments;
              method="ratio"/"difference" vocabulary fixed ("residual" now refers only
              to the prewhitened residual chronology to avoid confusion).
            - chron(): user-controllable AR order (max_lag, aic) when prewhitening;
              unified std/res/ars/samp_depth column names across chron/chron_ars;
              chron_stabilized() variance stabilization now has Briffa (MEANr) and
              spline methods from ARSTAN.
            - Crossdating: xdate() completely reworked to match dplR, with dplR-style
              crossdating plots; interseries_corr()/series_corr() consolidated and
              now much faster.
            - Indices & tree-level: sens1()/sens2() (mean sensitivity), sorry Andy!
              Gleichlaeufigkeit and synchronous growth changes, tree_mean()
              (average cores to tree level first), sss() and rwi_stats() with a shared
              common-interval helper, and pith offset helpers (po_to_wc/wc_to_po) from dplR
            - fill_internal(): internal-NA infilling, including a direct port of Ed Cook's
              ARSTAN method.

            Input/Output:
            - read_crn(): read Tucson chronology (.crn) files -- single, stacked
              ARSTAN-like, and combined multi-site files
            - writers(): substantial rewrite

            Reader refinements (in addition to those in v0.3.0):
            - Data/header classification is strict fixed-position (no whitespace
              fallback), but a header line with a stray number no longer causes trouble
              and a "#" inside a series ID is no longer read as a (Python) comment.
            - Bunched negative (BCE) years of any width now parse correctly, so long
              chronologies are now properly read.
            - TAB characters and shifted columns are detected and, in strict mode,
              refused with a message that names the offending series.
            - Missing per-series precision is inferred from terminated siblings;
              strict mode only refuses when no terminator exists anywhere in a file.
            - Every strict-mode error now names the series and year responsible.

            Other:
            - Biweight robust mean (tbrm) and the correlation functions consolidated;
              naming unified across dplPy; test suite expanded. 
          draft: false
          prerelease: true
