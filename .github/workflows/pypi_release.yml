# Build the package and publish it to PyPI after tests pass.
name: Publish to PyPI
on:
  workflow_run:
    workflows: ["run_tests"]
    types:
      - completed
    branches:
      - v0.5.0

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v3
        with:
          ref: v0.5.0
      - name: Set up Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: 3.11
      - name: Build package
        run: |
          python -m pip install -U pip build
          python -m build
      - name: Publish
        uses: pypa/gh-action-pypi-publish@v1.5.0
        with:
          user: __token__
          password: ${{ secrets.DPLPY_PYPI }}
      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: v0.5.0
          release_name: v0.5.0
          body: |
            dplPy v0.5.0

            v0.5.0 extends the crossdating tools toward COFECHA-level output, adds
            floating-series dating, basal area increment, dataset combination, and
            LiPD interchange, continues to improve the reader, and completes a deep
            fidelity audit of the crossdating stack.

            New functionality:
            - Crossdating: xdate() gains a COFECHA emulation mode (preset="COFECHA")
              -- Burg (maximum-entropy) AR prewhitening, spline variance
              stabilization, an arithmetic z-scored leave-one-out master, COFECHA
              segment anchoring and t-based critical values, and "omit absent
              rings". The dplR-faithful default is unchanged.
            - xdate_report(): COFECHA-style batch reports for ITRDB files, with
              per-series and per-segment correlations and a length-weighted summary
              (both a dplR-faithful and a preset="COFECHA" mode).
            - xdate_floater(): date a floating (undated) series against a dated
              reference. Based on dplR's xdate.floater and extended with the t
              statistic and additional crossdating statistics of Wilson (2026).
            - bai_out()/bai_in(): basal area increment (ports of dplR's
              bai.out/bai.in).
            - combine_rwl(): combine ring-width datasets (port of dplR's
              combine.rwl).
            - LiPD: to_lipd()/from_lipd()/lipd_metadata() for LiPD export and
              import, with NOAA metadata helpers and controlled vocabulary. LiPD is
              an optional extra: pip install "dplpy[lipd]".

            Input/Output:
            - read_crn(): negative (BC/BCE) years now parse like dplR, so
              long chronologies read correctly.
            - readers(): flexible joining behavior for repeated/duplicate and
              non-overlapping same-name series (prep for xdate_report); explicit
              recognition of and informative errors for bogus -noaa.rwl files;
              strict mode (warn-and-raise) that mirrors dplR; and better handling of
              excess-value rows and assorted .rwl edge cases.

            Consistency and correctness:
            - Yule-Walker AR estimation aligned with dplR across chron(), autoreg(),
              and stats() (which now reports the ACF at lag 1, as dplR does), and
              rbar pairwise-missing handling matched to dplR.
            - Uniform plotting styles across the spaghetti, segment, detrend, and
              chronology plots.

            Quality:
            - A deep fidelity audit of the crossdating stack: removed a bug in
              B-flag identification (the default B flag is now COFECHA-faithful),
              fixed another segment-floor bug, corrected or qualified
              docstring fidelity package-wide (grounded in dplR 1.8.0, CRUST,
              and COFECHA sources), and added more regression tests.
          draft: false
          prerelease: true
