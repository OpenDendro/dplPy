# Build the package, publish it to PyPI, and create the GitHub release after the
# tests pass on a release branch.
#
# Release flow (see release-instructions.md): bump the version on main, then
# create a branch named `v` + the version (e.g. `v0.9.0`). Pushing that branch
# runs `run_tests`; when it succeeds this workflow builds the package, publishes
# it to PyPI with trusted publishing (no API token secret), and creates the
# GitHub release and tag named after the branch. Nothing in this file is edited
# per release: the tag, release name and notes are derived from the triggering
# branch and CHANGELOG.md.
#
# One-time setup: PyPI trusted publishing must be configured for this
# repository (pypi.org -> project dplpy -> Publishing -> add a GitHub publisher
# with owner OpenDendro, repository dplPy, workflow pypi_release.yml,
# environment pypi).
name: Publish to PyPI
on:
  workflow_run:
    workflows: ["run_tests"]
    types:
      - completed
    branches:
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: pypi
    permissions:
      id-token: write      # PyPI trusted publishing (OIDC)
      contents: write      # create the GitHub release and tag
    env:
      RELEASE_TAG: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Check the release branch matches the package version
        run: |
          python - <<'EOF'
          import os, re, sys, tomllib
          tag = os.environ["RELEASE_TAG"]
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          if not re.fullmatch(r"v\d+\.\d+\.\d+([-.][0-9A-Za-z.]+)?", tag):
              sys.exit(f"branch {tag!r} is not a release branch (expected vX.Y.Z)")
          if tag != "v" + version:
              sys.exit(f"branch {tag!r} does not match pyproject version {version!r}")
          print("releasing", tag)
          EOF
      - name: Build package
        run: |
          python -m pip install -U pip build
          python -m build
      - name: Extract release notes from CHANGELOG.md
        run: |
          python - <<'EOF'
          import os, re
          tag = os.environ["RELEASE_TAG"]
          version = tag[1:]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          # the "## [X.Y.Z] - date" section, up to the next "## " heading
          m = re.search(r"^## \[%s\][^\n]*\n(.*?)(?=^## |\Z)" % re.escape(version),
                        text, re.S | re.M)
          body = m.group(1).strip() if m else ""
          if not body:
              body = ("dplPy %s. See CHANGELOG.md for details." % tag)
          body = "dplPy %s\n\n%s\n\nhttps://pypi.org/project/dplpy/%s/" % (tag, body, version)
          open("release_notes.md", "w", encoding="utf-8").write(body)
          print(body)
          EOF
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          body_path: release_notes.md
          # a tag with a suffix (v1.0.0-rc1, v1.0.0-beta.2) is a pre-release
          prerelease: ${{ contains(github.event.workflow_run.head_branch, '-') }}
          files: dist/*
