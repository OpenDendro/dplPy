name: run_tests

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"] # Goal is to run tests for different python versions
        include:
          # The LiPD extra (pylipd) is installed on one matrix entry so the
          # to_lipd/from_lipd/lipd_metadata tests run rather than skip.
          - python-version: "3.13"
            extras: "[lipd]"

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Display Python version
        run: python -c "import sys; print(sys.version)"
      - name: Build dplpy
        run: |
          python -m pip install -U pip build
          python -m build
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.python-version }}-requirements.txt
          pip install pytest pytest-cov
          pip install ruff
          pip install -e ".${{ matrix.extras }}"
      # Lint findings are reported as annotations but do not fail the build yet
      # (continue-on-error). Rules live in [tool.ruff] in pyproject.toml. Drop
      # continue-on-error once the existing findings are cleared.
      - name: Lint with Ruff
        run: |
          ruff check --output-format=github .
        continue-on-error: true
      - name: Run unit tests
        run: |
          pytest tests/unit --cov=dplpy
      - name: Run integ tests
        run: |
          pytest tests/integs -rA
