# Conda environment for developing dplPy (see dev-instructions.md).
#   conda env create -f environment.yml && conda activate dplpy
# The package itself is installed in editable mode (`-e .`) so `import dplpy`
# picks up your working copy under src/ and `pytest` runs against it.
name: dplpy
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.11
  - pandas
  - numpy
  - scipy
  - statsmodels
  - matplotlib
  - ipykernel
  - pip
  - pip:
    - csaps
    - -e .
    - jupyterlab
    - notebook
    - pytest
    - pytest-cov
    - ruff
